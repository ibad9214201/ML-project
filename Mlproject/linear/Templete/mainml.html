<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clickable Containers</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
.box{
    background:#f8f9fa;
    border:2px solid #dee2e6;
    border-radius:10px;
    padding:40px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.box:hover{
    background:#0d6efd;
    color:white;
    transform:scale(1.05);
}
</style>
</head>

<body>

<div class="container mt-5">

    <!-- Row 1 -->
    <div class="row g-4">

        <div class="col-md-4">
            <div class="box nav-box" data-url="{% url 'Houseprice' %}">
                Linear Regression
            </div>
        </div>

        <div class="col-md-4">
            <div class="box nav-box" data-url="{% url 'poly_nomial' %}">
                Polynomial
            </div>
        </div>

        <div class="col-md-4">
            <div class="box nav-box" data-url="{% url 'Decisiontree' %}">
                Decisiontre
            </div>
        </div>

    </div>

    <!-- Row 2 -->
    <div class="row g-4 mt-2">

        <div class="col-md-4">
            <div class="box nav-box" data-url="/page4/">
                Container 4
            </div>
        </div>

        <div class="col-md-4">
            <div class="box nav-box" data-url="/page5/">
                Container 5
            </div>
        </div>

        <div class="col-md-4">
            <div class="box nav-box" data-url="/page6/">
                Container 6
            </div>
        </div>

    </div>

</div>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
$(document).ready(function(){

    $(".nav-box").click(function(){

        let url = $(this).data("url");

        if(url){
            window.location.href = url;
        }

    });

});
</script>

</body>
</html>
